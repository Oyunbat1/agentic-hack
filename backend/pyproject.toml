[project]
name = "sags"
version = "0.1.0"
description = "Сагс — хувийн худалдан авалтын агент (Agentic Commerce Hackathon)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pymongo>=4.10",
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sags*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
